name: Publish SUPERCODE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            arch: x64
          - os: ubuntu-latest
            target: linux-arm64
            arch: arm64
          - os: ubuntu-latest
            target: linux-x64-musl
            arch: x64
            abi: musl
          - os: macos-latest
            target: darwin-arm64
            arch: arm64
          - os: macos-latest
            target: darwin-x64
            arch: x64
          - os: windows-latest
            target: win32-x64
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun run --cwd packages/opencode script/generate.ts
        env:
          SUPERCODE_CHANNEL: stable
          SUPERCODE_VERSION: ${{ github.ref_name }}
      - name: Build binary
        run: bun run --cwd packages/opencode script/build.ts --single --skip-install
        env:
          SUPERCODE_CHANNEL: stable
          SUPERCODE_VERSION: ${{ github.ref_name }}
      - name: Package binary
        shell: bash
        run: |
          cd packages/opencode/dist
          DIR="supercode-${{ matrix.target }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cd "$DIR/bin" && zip -r "../../../supercode-${{ matrix.target }}.zip" supercode.exe
          else
            cd "$DIR/bin" && tar -czf "../../../supercode-${{ matrix.target }}.tar.gz" supercode
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            supercode-*.tar.gz
            supercode-*.zip
          generate_release_notes: true

  publish-install-script:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: install
          generate_release_notes: false
